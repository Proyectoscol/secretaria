[pytest]
# KOS test configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    integration: marks tests as integration tests requiring a live DB (deselect with -m "not integration")
    slow: marks tests as slow (deselect with -m "not slow")

# Show test summary for failures and errors
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not integration"

# Ignore __pycache__ dirs in test discovery
norecursedirs = __pycache__ .git .venv node_modules .eggs
