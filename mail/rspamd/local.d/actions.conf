# =============================================================================
# Rspamd — spam action thresholds
# Scores are cumulative; higher = more suspicious
# =============================================================================

# Mark as spam (add X-Spam header) — score 6+
add_header {
  score = 6.0;
}

# Move to Junk folder — score 10+
rewrite_subject {
  score = 10.0;
}

# Reject — score 15+
reject {
  score = 15.0;
}

# Greylist (temporary defer) — score 4+
greylist {
  score = 4.0;
}
