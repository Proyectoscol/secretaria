# =============================================================================
# Dovecot mail location configuration
# =============================================================================

# Maildir format — one file per message, easy to inspect and back up
mail_location = maildir:/var/mail/vhosts/%d/%n

# Namespace definition
namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts    { special_use = \Drafts;    auto = subscribe; }
  mailbox Sent      { special_use = \Sent;       auto = subscribe; }
  mailbox Trash     { special_use = \Trash;      auto = subscribe; }
  mailbox Spam      { special_use = \Junk;       auto = subscribe; }
  mailbox Archive   { special_use = \Archive;    auto = subscribe; }
  mailbox Processed { auto = subscribe; }
  mailbox Rejected  { auto = subscribe; }
}

# Mailbox permissions
mail_privileged_group = vmail
