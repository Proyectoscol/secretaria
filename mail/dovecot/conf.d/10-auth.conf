# =============================================================================
# Dovecot auth configuration
# =============================================================================

# Disable plaintext auth unless TLS is active
disable_plaintext_auth = yes
auth_mechanisms = plain login

# Password file — managed by the mail account creation script
passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = /etc/dovecot/users
  default_fields = uid=5000 gid=5000 home=/var/mail/vhosts/%d/%n
}
