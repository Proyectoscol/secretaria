# =============================================================================
# Dovecot master process configuration
# =============================================================================

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 0
  vsz_limit = 64M
}

service imap {
  vsz_limit = 256M
}

service lmtp {
  # Receive from Postfix via Unix socket
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
  # Also listen on TCP for health checks
  inet_listener lmtp {
    port = 24
  }
}

# Auth service — Postfix talks to this for SASL authentication
service auth {
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
  # Postfix smtp-auth
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
    user = postfix
    group = postfix
  }
  user = dovecot
}

service auth-worker {
  user = vmail
}

# SSL configuration (uses Let's Encrypt certs mounted from host)
ssl = required
ssl_cert = </etc/letsencrypt/live/${MAIL_DOMAIN}/fullchain.pem
ssl_key = </etc/letsencrypt/live/${MAIL_DOMAIN}/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = no
