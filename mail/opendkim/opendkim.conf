# =============================================================================
# OpenDKIM configuration
# Signs outgoing messages and verifies incoming signatures
# =============================================================================

# Run as daemon
Background                      no
Syslog                          yes
SyslogSuccess                   yes
LogWhy                          yes
Canonicalization                relaxed/simple

# Sign for these domains
Domain                          ${MAIL_DOMAIN}
KeyFile                         /etc/opendkim/keys/${MAIL_DOMAIN}/private.key
Selector                        openclaw

# Mode: s = sign (outgoing), v = verify (incoming)
Mode                            sv

# Listen on TCP port — Postfix connects here
Socket                          inet:8891@0.0.0.0

# Trust signatures from local network
PeerList                        127.0.0.1

# Internal hosts don't need to be verified (we sign their outbound mail)
InternalHosts                   127.0.0.1, 172.16.0.0/12, 10.0.0.0/8

# If verification fails on incoming mail: accept but mark (header added)
# Rejection is Rspamd's job
On-BadSignature                 accept
On-NoSignature                  accept
On-SignatureError                accept

# Stats
Statistics                      /var/run/opendkim/stats.dat
